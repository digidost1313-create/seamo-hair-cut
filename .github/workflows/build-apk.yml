name: Build SEAMO APK/AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode binary assets (stored as base64 because the GitHub push connector is text-only)
        run: |
          find . -name '*.b64' -type f -exec sh -c 'base64 -d "$1" > "${1%.b64}"' _ {} \;
          ls android/gradle/wrapper/gradle-wrapper.jar android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/raw/booking_alert.wav
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Install deps and build web
        run: |
          npm ci
          npm run build
      - name: Sync Capacitor Android
        run: |
          npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Build release AAB (unsigned — add signing in repo secrets for Play)
        run: cd android && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: seamo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: seamo-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
